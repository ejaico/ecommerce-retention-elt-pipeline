name: Nightly E-Commerce ELT Pipeline

on:
  schedule:
    # Runs automatically every night at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger button on GitHub

jobs:
  run-elt-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests duckdb dbt-duckdb

      - name: Execute Extraction & DuckDB Loading
        run: |
          python extract_and_load.py

      - name: Execute dbt Transformations & Data Quality Tests
        run: |
          cd dbt_ecommerce
          dbt run --profiles-dir .
          dbt test --profiles-dir .